[tool.ruff]
# Explicit, pinned Ruff configuration for the backend.
# Keep in sync with CONTRIBUTING.md and the `backend-lint` CI job, which runs
# `ruff check .` and `ruff format --check .` from this directory.
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Explicit rule selection so local and CI behavior is pinned and enforceable.
#   E/W - pycodestyle errors & warnings
#   F   - pyflakes
#   I   - isort (import sorting)
#   UP  - pyupgrade
#   B   - flake8-bugbear
select = ["E", "W", "F", "I", "UP", "B"]

ignore = [
    # Line length is owned by the formatter, which leaves un-splittable long
    # lines (URLs, strings) intact; enforcing E501 would only add noise.
    "E501",
    # FastAPI's dependency-injection idiom relies on calls in argument defaults
    # (Depends(), Query(), ...), so B008 is a false positive here by design.
    "B008",
    # --- Grandfathered: violations that pre-date this config. -----------------
    # The rule families above are enabled so *new* code is held to them; the
    # codes below are currently present in the tree and are ignored to keep CI
    # green without a mass reformat. Drop entries here as the code is migrated.
    "I001",   # import blocks not yet isort-sorted
    "UP006",  # use PEP 585 generics (List -> list)
    "UP017",  # datetime.timezone.utc -> datetime.UTC
    "UP033",  # lru_cache(maxsize=None) -> cache
    "UP035",  # deprecated typing imports
    "UP037",  # remove quotes from annotations
    "UP041",  # TimeoutError aliases
    "UP042",  # str + Enum -> StrEnum
    "UP045",  # Optional[X] -> X | None
    "B007",   # unused loop control variable
    "B904",   # raise ... from within except
    "B905",   # zip() without explicit strict=
]

[tool.ruff.format]
# Match the style the codebase is already formatted in (Ruff defaults).
quote-style = "double"
indent-style = "space"
