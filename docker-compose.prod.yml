services:
  postgres:
    image: postgres:16-alpine
    # Bound to loopback only: reachable from the host for admin/psql, never
    # from another machine on the network. Other services reach it by the
    # `postgres` service name over the internal compose network regardless.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    # Loopback-only: the S3 API (9000) and console (9001) are not exposed to
    # the network. The backend reaches MinIO via the `minio` service name.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Jaeger v2 — OTLP is the native ingestion path (no extra env var needed).
  # UI at http://localhost:16686. Backend ships traces via OTLP/gRPC on 4317.
  # In a real production deployment, replace this with whatever collector
  # your infra runs (Datadog, Honeycomb, SigNoz, Grafana Tempo, etc.) and
  # point OTEL_EXPORTER_OTLP_ENDPOINT at it instead.
  jaeger:
    image: jaegertracing/jaeger:2.17.0
    # UI is loopback-only (traces leak prompts, file paths, token counts, so
    # it must never be world-readable). The OTLP ingest ports (4317/4318) are
    # NOT published — the backend reaches them over the internal network by
    # the `jaeger` service name.
    ports:
      - "127.0.0.1:16686:16686"  # Jaeger UI
    restart: unless-stopped

  backend:
    image: ghcr.io/lucastononro/trainable-backend:${TRAINABLE_BACKEND_TAG:-latest}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Derived from the operator-supplied Postgres/MinIO secrets above so the
      # backend's credentials always match the datastores. No hardcoded creds.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      S3_ENDPOINT: http://minio:9000
      S3_ENDPOINT_EXTERNAL: http://localhost:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      AWS_REGION: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: trainable-backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      jaeger:
        condition: service_started

  frontend:
    image: ghcr.io/lucastononro/trainable-frontend:${TRAINABLE_FRONTEND_TAG:-latest}
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
